<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>14 февраля</title>
  <style>
    :root {
      --bg1: #ffd6e0;
      --bg2: #fff5f8;
      --accent: #ff3b6f;
      --accent2: #6a0dad;
      --text: #2b1a1f;
      --muted: rgba(43, 26, 31, 0.45);
      --card: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 20% 10%, #ffe9f0 0%, transparent 60%),
                  radial-gradient(900px 500px at 80% 0%, #ffe0ea 0%, transparent 55%),
                  linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 16px;
    }

    .page {
      display: none;
      width: 100%;
      max-width: 520px;
      min-height: 100%;
    }

    .page.active { display: block; }

    .card {
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 20px 16px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      min-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    h1 {
      font-size: 26px;
      line-height: 1.25;
      margin: 0;
      text-align: center;
    }

    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .image-slot {
      height: 120px;
      border-radius: 14px;
      border: 2px dashed rgba(0,0,0,0.12);
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0,0,0,0.35);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .image-grid.large .image-slot {
      height: 170px;
    }

    .image-grid.large .full-width {
      height: 340px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
      position: relative;
      min-height: 180px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 18px 12px;
      font-size: 20px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #yesBtn { background: var(--accent); box-shadow: 0 8px 18px rgba(255,59,111,0.35); }
    #yesBtn:active { transform: scale(0.98); }
    #yesBtn {
      animation: pulse 1.6s ease-in-out infinite;
    }

    #noBtn {
      background: #444;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      position: relative;
    }

    .footer-note {
      margin-top: auto;
      font-size: 12px;
      text-align: center;
      color: var(--muted);
    }

    .celebrate {
      text-align: center;
      font-size: 22px;
    }

    .big-emoji {
      font-size: 48px;
      line-height: 1;
    }

    .full-width {
      grid-column: span 2;
      height: 260px;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      top: -40px;
      will-change: transform, opacity;
      animation-name: fall;
      animation-timing-function: ease-in;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 110vh, 0) rotate(320deg);
        opacity: 0;
      }
    }

    @media (min-width: 540px) {
      h1 { font-size: 28px; }
      .image-slot { height: 140px; }
      button { font-size: 22px; }
      .full-width { height: 320px; }
      .image-grid.large .image-slot { height: 200px; }
      .image-grid.large .full-width { height: 380px; }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 8px 18px rgba(255,59,111,0.35), 0 0 0 0 rgba(255,59,111,0.45);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 12px 26px rgba(255,59,111,0.45), 0 0 0 12px rgba(255,59,111,0.08);
        transform: scale(1.02);
      }
      100% {
        box-shadow: 0 8px 18px rgba(255,59,111,0.35), 0 0 0 0 rgba(255,59,111,0.0);
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <section id="page1" class="page active">
    <div class="card">
      <h1>Аида, будешь моей парой на 14 февраля?</h1>

      <div class="image-grid">
        <div class="image-slot full-width">
          <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMW01dG52OTI5aGloOHE0OWd4Z2Z2dHppNGNhMmhlemEzYjRrNnMzMiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3oz8xLlw6GHVfokaNW/giphy.gif" alt="Праздничная гифка" />
        </div>
      </div>

      <div class="buttons" id="buttonArea">
        <button id="yesBtn" type="button">Да</button>
        <button id="noBtn" type="button">Нет</button>
      </div>

      <div class="footer-note">ответ нет не принимается</div>
    </div>
  </section>

  <section id="page2" class="page">
    <div class="card">
      <div class="celebrate">
        <div class="big-emoji">🎉💖</div>
        <h1>Урааа! Мы вместе на 14 февраля!</h1>
        <div></div>
      </div>

      <div class="image-grid large">
        <div class="image-slot">
          <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZzJjczRoZWR3a3VrM3FuZGt1cGFpYnFiMTJrZzNoMGE2N3c4Z2Q1bCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/DDgHvbLeMkemvhKxgB/giphy.gif" alt="Праздничная гифка 1" />
        </div>
        <div class="image-slot">
          <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZW9mdGxnaTlpM3hmbmRuYWY3cDZoOWV3MmN6Mzhyb3ZhdGd2eG1yNSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/UmnWEKDFoPmcZHmwFl/giphy.gif" alt="Праздничная гифка 2" />
        </div>
        <div class="image-slot full-width">
          <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExanBiNW9yMHkzMmY0bTNheWFoMmltMWlxdGF6aTMxOTV4YXVudGZ1dSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Zl7u48zLVFgLpRwq6f/giphy.gif" alt="Праздничная гифка 3" />
        </div>
      </div>

      <div class="buttons">
        <button id="partyBtn" type="button">Жмяк ❤️</button>
        <button id="backBtn" type="button">Назад</button>
      </div>

      <div class="footer-note">Это была судьба</div>
    </div>
  </section>

  <script>
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const backBtn = document.getElementById('backBtn');
    const partyBtn = document.getElementById('partyBtn');

    function showPage2() {
      page1.classList.remove('active');
      page2.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showPage1() {
      page2.classList.remove('active');
      page1.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    yesBtn.addEventListener('click', showPage2);
    backBtn.addEventListener('click', showPage1);
    partyBtn.addEventListener('click', () => {
      partyBtn.textContent = 'Ура!';
      partyBtn.style.background = '#ff7aa8';
      launchConfetti();
    });

    function launchConfetti() {
      const layer = document.createElement('div');
      layer.className = 'confetti-layer';
      document.body.appendChild(layer);

      const emojis = ['💖', '💘', '💝', '🎉', '😍', '🥳', '😊', '❤️'];
      const count = 26;

      for (let i = 0; i < count; i += 1) {
        const el = document.createElement('span');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        const size = 18 + Math.random() * 18;
        const left = Math.random() * 100;
        const duration = 1.6 + Math.random() * 1.4;
        const delay = Math.random() * 0.4;

        el.style.left = `${left}vw`;
        el.style.fontSize = `${size}px`;
        el.style.animationDuration = `${duration}s`;
        el.style.animationDelay = `${delay}s`;

        layer.appendChild(el);
      }

      const cleanupDelay = 3200;
      setTimeout(() => {
        layer.remove();
      }, cleanupDelay);
    }

    function moveNoButton() {
      const btn = noBtn.getBoundingClientRect();
      const yes = yesBtn.getBoundingClientRect();

      const padding = 8;
      const safeGap = 20;
      const viewportW = document.documentElement.clientWidth;
      const viewportH = document.documentElement.clientHeight;
      const maxX = Math.max(0, viewportW - btn.width - padding * 2);
      const maxY = Math.max(0, viewportH - btn.height - padding * 2);

      const yesRel = {
        left: yes.left - safeGap,
        top: yes.top - safeGap,
        width: yes.width + safeGap * 2,
        height: yes.height + safeGap * 2,
      };

      function intersects(a, b, gap = 6) {
        return !(
          a.left + a.width + gap < b.left ||
          a.left > b.left + b.width + gap ||
          a.top + a.height + gap < b.top ||
          a.top > b.top + b.height + gap
        );
      }

      let randX = padding + Math.random() * maxX;
      let randY = padding + Math.random() * maxY;

      for (let i = 0; i < 25; i += 1) {
        const candidate = { left: randX, top: randY, width: btn.width, height: btn.height };
        if (!intersects(candidate, yesRel)) break;
        randX = padding + Math.random() * maxX;
        randY = padding + Math.random() * maxY;
      }

      noBtn.style.position = 'fixed';
      noBtn.style.zIndex = '50';
      noBtn.style.left = `${randX}px`;
      noBtn.style.top = `${randY}px`;
    }

    function handleNoAttempt(e) {
      e.preventDefault();
      moveNoButton();
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('pointerdown', handleNoAttempt);
  </script>
</body>
</html>
